    - title: Research Collaborator — Amyloid Beta Protein Aggregation Simulation
      institution: Krea University
      department: Biological Sciences
      key_people: Dr. Kalyan Chakrabarti and Dr. Nasrollah Rezaei-Ghaleh
      location: Sri City, AP, India.
      start_date: Nov 2021
      end_date: Mar 2022
      skills:
        - name: COPASI
          icon: fa-solid fa-flask
          description: "Modeled Amyloid beta accumulation and degradation through deterministic systems of hundreds of differential equations."
        - name: STEPS
          icon: fa-solid fa-cube
          description: "Adapted deterministic models into stochastic diffusion systems with reaction-mixture properties for microscopic analysis."
        - name: Parameter Optimization
          icon: fa-solid fa-sliders-h
          description: "Developed parallelized parameter scanning scripts exponentially reducing computation time for model exploration."
        - name: Systems Biology
          icon: fa-solid fa-project-diagram
          description: "Designed first-principles models leveraging literature data to capture biochemical and biophysical dynamics."
      domains:
        - name: Alzheimer's Disease
          description: "Computational modeling of Amyloid beta aggregation and neuroinflammation dynamics in Alzheimer's disease pathogenesis."
        - name: Mathematical Modeling
          description: "Complex systems modeling using deterministic and stochastic approaches for biochemical pathway analysis."
        - name: Neuroinflammation
          description: "Investigation of neuroinflammatory processes and their impact on Amyloid beta accumulation through computational simulation."
      maindescription: Modeled the accumulation and degradation of Amyloid beta in Alzheimer's disease as a function of neuroinflammation, initially by simulating an existing deterministic system of hundreds of differential equations (COPASI). Developed scripts to parallelize parameter scans, exponentially reducing computation time and enabling in-depth exploration of model behavior. Adapted the model using STEPS into a stochastic diffusion system with reaction-mixture properties to investigate the impact of microscopic stochasticity on global system states. Worked on designing a de-novo, first-principles model that leverages literature data to more accurately capture the biochemical and biophysical dynamics underlying Amyloid beta aggregation. Analyzed and interpreted high-dimensional simulation data to gain insights into disease mechanisms.
      description:
        - My contributions towards the initial understanding of the complex system and reverse engineering the COPASI model into its constituting coupled differential equations significantly laid the groundwork for multiple student capstone projects in the Biological Sciences, and ultimately culminated in a <i>Nature npj Systems Biology and Applications</i> (2024) paper titled "Bifurcations in coupled amyloid-β aggregation-inflammation systems".

