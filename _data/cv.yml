    - name: Summary
      value: I am an independent computational biology researcher currently focused on uncovering the mechanistic foundations of protein folding using deep learning, AlphaFold, and molecular dynamics. My work blends transformer interpretability, perturbation-based analysis, and physical modeling to extract biophysically meaningful trajectories from AI models. I specialize in building robust HPC pipelines, scientific software, and visualization tools to study and solve fundamental problems at scale. My approach is rooted in first-principles thinking, rigorous experimentation, and practical problem-solving across biology, chemistry, and machine learning.

