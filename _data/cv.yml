          icon: fa-solid fa-wave-square
          description: "Developed advanced feature engineering algorithms for multi-channel EEG/ECoG signals to extract unique epileptic biomarker signatures using high-frequency oscillations (HFOs)."
        - name: Machine Learning
          icon: fa-solid fa-robot
          description: "Trained machine learning models to classify physiological vs pathological neural signals for seizure prediction. Implemented custom algorithms for non-stationary time series analysis."
        - name: Linux
          icon: fa-brands fa-linux
          description: "Designed and built custom Linux kernels using Clear Linux patches with optimized schedulers for compute workloads, achieving 20-30% higher throughput on multithreaded operations."
        - BTRFS
        - Performance Optimization
      domains:
        - Computational Neuroscience
        - Signal Processing
        - Linux System Administration
      maindescription: Developed highly efficient feature engineering algorithms on large-scale non-stationary multi-channel time signals from ECoG/EEG data to generate unique epileptic biomarker signatures using high-frequency oscillations (HFOs). Derivative datasets were generated to train machine learning models to classify physiological and pathological signals to predict epileptic seizure onset using interictal EEG signals.
      description:
        - Designed and built custom Linux kernels using Clear Linux patches and tuned schedulers optimized for compute and memory workloads. (20-30% higher throughput on multithreaded workloads with lower memory usage per thread)
        - Benchmarked and implemented BTRFS storage subsystems that used a patched version of ZSTD to enable robust multi-terabyte scale data storage and analysis on a consumer laptop using transparent disk compression. (50-70% smaller storage footprint with equal or better read performance)

