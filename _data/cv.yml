      maindescription: Diagnosed performance bottlenecks and zombie processes. Migrated and upgraded the cluster to Rocky Linux 8.9 from EOL CentOS 7. Setup user accounts and PBS job scheduler across the login and compute nodes. Configured CUDA, libraries and drivers for NVIDIA GPU-accelerated workloads. Setup ZFS pools for network attached home and scratch directories, optimized for read/write performance and resiliency. Wrote user-accessible environment modules across quantum chemistry, data analysis, deep learning, molecular dynamics and finance software packages, in addition to diagnosing and resolving issues faced by users across the software stack. Software was compiled and the Linux kernel was tuned for best performance.

