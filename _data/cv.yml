    - title: Data Analyst and Research Associate
      institution: Krea University
      department: Computational Neuroscience
      key_people: Dr. Shyam Kumar Sudhakar
      location: Sri City, AP, India.
      start_date: Jul 2022
      end_date: Jan 2025
      skills:
        - name: NetworkX
          icon: fa-solid fa-network-wired
          description: "Developed novel algorithms for recursive disease clustering using graph theory measures, specifically betweenness centrality analysis."
        - name: Pandas
          icon: fa-solid fa-table
          description: "Built robust data processing pipeline for large-scale medical datasets (50,000+ rows, 1000+ columns) with structured comorbidity extraction."
        - name: Matplotlib
          icon: fa-solid fa-chart-bar
          description: "Created comprehensive data visualizations for disease network analysis and comorbidity pattern discovery in medical research."
        - name: Python
          icon: fa-brands fa-python
          description: "Architected complete data processing pipeline leveraging statistical methods and graph algorithms for medical data analysis."
        - name: Graph Theory
          icon: fa-solid fa-project-diagram
          description: "Applied advanced graph theory concepts to discover previously unknown disease networks through betweenness centrality clustering."
        - name: Statistical Methods
          icon: fa-solid fa-chart-line
          description: "Implemented statistical approaches for extracting structured comorbidity data and validating disease network discoveries."
      domains:
        - name: Graph Theory
          description: "Applied graph-based approaches to medical data analysis, developing novel clustering algorithms for disease network discovery."
        - name: Computational Neuroscience
          description: "Neurological data analysis focused on traumatic brain injury patient records and comorbidity pattern identification."
        - name: Medical Data Analysis
          description: "Large-scale hospital record processing and analysis with structured extraction of complex medical relationships and patterns."
        - name: Statistics
          description: "Statistical modeling and analysis for medical research with focus on comorbidity relationships and disease clustering validation."
        - name: Traumatic Brain Injury
          description: "Specialized research in TBI patient data analysis leading to discovery of novel disease comorbidity networks and clinical insights."
      maindescription: As part of an undergraduate capstone thesis, developed a Python-based data processing pipeline leveraging Pandas for data manipulation and cleaning, NetworkX for graph representation and analysis, and matplotlib for data visualization. The pipeline was designed to process a large dataset of traumatic brain injury (TBI) patient hospital records (50,000+ rows, 1000+ columns), extracting structured comorbidity data using statistical methods. Developed a novel algorithm to recursively cluster diseases based on betweenness centrality, a graph theory measure, leading to the discovery of previously unknown disease networks. Papers published with Dr. Shyam Kumar Sudhakar in <i>Frontiers in human neuroscience</i> (2023), <i>Brain Organoid and Systems Neuroscience Journal</i> (2024) and <i>BMC Neurology</i> (2025).

