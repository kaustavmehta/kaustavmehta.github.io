      maindescription: I worked closely with students across varying levels of expertise, assisting in courses on Applied Statistics and Python for Data Science. I designed and graded assignments and exams, in addition to delivering tutorials and lecture materials. I specialized in disarming the intimidation students often face when learning complex technical skills, and I adapted my teaching to meet each student at their level. My ability to debug code live, explain concepts intuitively, and nurture curiosity became one of the most appreciated aspects of my teaching. I saw students who initially doubted their abilities grow confident and capable when offered space to explore without fear, knowing that they have a reliable support backing them.

    - title: HPC Cluster Linux Sysadmin
