name: Check external links

# Internal links are checked on every build in deploy.yml. External links (DOIs,
# arXiv, journals) can rot without any change here, so check them weekly against
# the live site instead of failing deploys on someone else's outage.

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-external-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Link Checker 🔗
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          fail: false
          args: --no-progress --max-concurrency 4 --accept 200,206,403,429 'https://kaustavmehta.github.io/' 'https://kaustavmehta.github.io/publications/' 'https://kaustavmehta.github.io/cv/'

      - name: Open an issue on failure 📝
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken external links on the site
          content-filepath: ./lychee/out.md
          labels: links
