name: Deploy site

# Builds once, checks the built HTML for broken internal links, and (on main only)
# publishes _site to the gh-pages branch. Pull requests get the same build and
# link check without deploying.

on:
  push:
    branches:
      - main
    paths-ignore: &docs-only
      - "docs/**"
      - "lighthouse_results/**"
      - "readme_preview/**"
      - "README.md"
      - "CLAUDE.md"
      - "CONTRIBUTING.md"
      - "CUSTOMIZE.md"
      - "FAQ.md"
      - "INSTALL.md"
  pull_request:
    branches:
      - main
    paths-ignore: *docs-only
  workflow_dispatch:

permissions:
  contents: write

# A newer push supersedes an in-flight build for the same branch or PR
concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JEKYLL_ENV: production
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true

      - name: Setup Node 🟩
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install ImageMagick 🖼️
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends imagemagick

      - name: Restore Jekyll cache ♻️
        uses: actions/cache@v4
        with:
          path: .jekyll-cache
          key: jekyll-${{ runner.os }}-${{ hashFiles('Gemfile.lock', '_config.yml') }}-${{ github.sha }}
          restore-keys: |
            jekyll-${{ runner.os }}-${{ hashFiles('Gemfile.lock', '_config.yml') }}-

      - name: Build 🔧
        run: bundle exec jekyll build

      - name: Purge unused CSS 🧹
        run: |
          npm ci --no-audit --no-fund
          node bin/purge-css.js

      - name: Check internal links 🔗
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: --offline --no-progress --root-dir "${{ github.workspace }}/_site" '_site/**/*.html'

      - name: Deploy 🚀
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          single-commit: true
